name: Publish to npm

# Manually dispatched after main has been tagged. Requires the
# NPM_TOKEN repo secret with publish permissions on the
# @citratelabs org. Without that secret, this workflow fails
# loudly on the publish step — the build step still verifies that
# the package is buildable.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest, next, etc.) — defaults to latest'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # SMK-B-009: refuse to release if .npmrc names a second registry host or
      # shares a publish credential across hosts. Publishing with
      # --ignore-scripts skips prepublishOnly, so this gate lives in the
      # workflow, not a package.json script.
      - name: .npmrc publish-integrity gate
        run: node scripts/check-npmrc.mjs

      # SMK-B-010: no HIGH+ advisory in the shipped (production) dependency tree.
      - name: Production dependency audit (blocking, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Tests MUST gate the publish: the audit tripwires (signEip712
      # routing, x402 fail-closed policy) only have teeth if a red
      # suite blocks the release. Do NOT add continue-on-error here —
      # that was finding FUA-SDK-MKT-02.
      - name: Test
        run: npm test

      - name: Verify version matches tag (if triggered by tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # SMK-B-001: never interpolate the free-text `workflow_dispatch`
          # input into the run: script text — GitHub substitutes ${{ }} BEFORE
          # bash runs, so a value like `latest"; curl … #` would break out of
          # the string and execute with NODE_AUTH_TOKEN in scope. Pass it
          # through env: instead, so bash only ever sees it as data, and
          # validate it against a strict allowlist below.
          DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN secret is not set on this repo. Cannot publish."
            exit 1
          fi
          if [[ ! "$DIST_TAG" =~ ^(latest|next|beta|rc)$ ]]; then
            echo "::error::Refusing to publish: dist-tag '$DIST_TAG' is not one of latest|next|beta|rc."
            exit 1
          fi
          npm publish --access public --tag "$DIST_TAG"
