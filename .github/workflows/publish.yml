name: Publish to npm

# Manually dispatched after main has been tagged. Requires the
# NPM_TOKEN repo secret with publish permissions on the
# @citratenetwork org. Without that secret, this workflow fails
# loudly on the publish step — the build step still verifies that
# the package is buildable.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest, next, etc.) — defaults to latest'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Verify version matches tag (if triggered by tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN secret is not set on this repo. Cannot publish."
            exit 1
          fi
          DIST_TAG="${{ github.event.inputs.tag || 'latest' }}"
          npm publish --access public --tag "$DIST_TAG"
