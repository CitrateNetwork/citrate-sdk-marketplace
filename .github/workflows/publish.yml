name: Publish to npm

# Runs on a v* tag push (or manual dispatch from the tag).
#
# Publishing uses npm TRUSTED PUBLISHING (OIDC), the same path as
# @citratelabs/sdk (citrate-sdk-js release.yml, PBA-L6-004): no npm token is
# stored in GitHub. @citratelabs/marketplace-sdk has a Trusted Publisher on
# npmjs.com bound to CitrateNetwork/citrate-sdk-marketplace + this file
# (publish.yml); npm issues a short-lived credential for this run only and
# records signed provenance for the tarball. The v0.2.0 run used the old
# NPM_TOKEN secret, which npmjs rejected (E404 on the PUT), so 0.2.0 never
# reached the registry.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (latest, next, etc.) — defaults to latest'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance (a signed build statement on npm) needs GitHub's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No registry-url here: that makes setup-node write an _authToken
      # placeholder into an .npmrc. The repo .npmrc already pins the registry,
      # and trusted publishing authenticates through OIDC, not a token.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@11.6.2
          npm --version

      - name: Install dependencies
        run: npm ci

      # SMK-B-009: refuse to release if .npmrc names a second registry host or
      # shares a publish credential across hosts. Publishing with
      # --ignore-scripts skips prepublishOnly, so this gate lives in the
      # workflow, not a package.json script.
      - name: .npmrc publish-integrity gate
        run: node scripts/check-npmrc.mjs

      # SMK-B-010: no HIGH+ advisory in the shipped (production) dependency tree.
      - name: Production dependency audit (blocking, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Tests MUST gate the publish: the audit tripwires (signEip712
      # routing, x402 fail-closed policy) only have teeth if a red
      # suite blocks the release. Do NOT add continue-on-error here —
      # that was finding FUA-SDK-MKT-02.
      - name: Test
        run: npm test

      - name: Verify version matches tag (if triggered by tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm (trusted publishing + provenance)
        env:
          # SMK-B-001: never interpolate the free-text `workflow_dispatch`
          # input into the run: script text — GitHub substitutes ${{ }} BEFORE
          # bash runs, so a value like `latest"; curl … #` would break out of
          # the string and execute inside the publish job. Pass it through env:
          # instead, so bash only ever sees it as data, and validate it against
          # a strict allowlist below.
          DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          if [[ ! "$DIST_TAG" =~ ^(latest|next|beta|rc)$ ]]; then
            echo "::error::Refusing to publish: dist-tag '$DIST_TAG' is not one of latest|next|beta|rc."
            exit 1
          fi
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already published; skipping."
          else
            npm publish --access public --provenance --tag "$DIST_TAG"
          fi
