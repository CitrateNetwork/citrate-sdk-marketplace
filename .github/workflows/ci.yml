name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    uses: CitrateNetwork/.github/.github/workflows/reusable-js-ci.yml@db5f1a6ddaec28275708265b56762eb1dfc3571b # main

  # SMK-B-009 + SMK-B-010: publish-integrity gates the reusable JS CI does not
  # cover. `check-npmrc` rejects a second registry host or a publish credential
  # shared across hosts (the dependency-confusion arming). The production audit
  # is BLOCKING at high; the full-tree audit is advisory (dev-only advisories
  # should surface without failing the build).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: .npmrc publish-integrity gate (blocking)
        run: node scripts/check-npmrc.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit (blocking, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (advisory)
        run: npm audit || true

  # CL-C2 / SW-179: fail the build if the vendored addresses.json drifts from the
  # canonical citrate-chain 40204.json. The reusable JS CI only runs
  # lint/build/test, so vendored-address drift shipped silently. Requires a
  # read-only token for CitrateNetwork/citrate-chain; inert until GitHub Actions
  # + CITRATE_CHAIN_READ_TOKEN are available (the local mirror
  # scripts/check-address-drift.sh runs the identical check meanwhile).
  address-drift:
    runs-on: ubuntu-latest
    # Internal-only gate (checks vendored addresses against the canonical set in the PRIVATE
    # citrate-chain). Skips on public/fork CI (no token) so public CI never checks out a private
    # repo; runs authoritatively on internal pushes once CITRATE_CHAIN_READ_TOKEN is set.
    env:
      CHAIN_TOKEN: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
    steps:
      - name: Skipped on public/fork CI (no chain read token)
        if: env.CHAIN_TOKEN == ''
        run: echo "address-drift is an internal supply-chain gate; skipped without CITRATE_CHAIN_READ_TOKEN."
      - name: Checkout this repo
        if: env.CHAIN_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: citrate-sdk-marketplace
      - name: Checkout canonical citrate-chain (sparse)
        if: env.CHAIN_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CitrateNetwork/citrate-chain
          ref: main
          token: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
          path: citrate-chain
          sparse-checkout: |
            contracts/addresses
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.CHAIN_TOKEN != ''
        with:
          node-version: 20
      - name: Address drift gate (blocking)
        if: env.CHAIN_TOKEN != ''
        run: cd citrate-sdk-marketplace && npm run sync-addresses:check
