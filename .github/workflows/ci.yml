name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    uses: CitrateNetwork/.github/.github/workflows/reusable-js-ci.yml@db5f1a6ddaec28275708265b56762eb1dfc3571b # main

  # SMK-B-009 + SMK-B-010: publish-integrity gates the reusable JS CI does not
  # cover. `check-npmrc` rejects a second registry host or a publish credential
  # shared across hosts (the dependency-confusion arming). The production audit
  # is BLOCKING at high; the full-tree audit is advisory (dev-only advisories
  # should surface without failing the build).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: .npmrc publish-integrity gate (blocking)
        run: node scripts/check-npmrc.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit (blocking, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (advisory)
        run: npm audit || true

  # CL-C2 / SW-179: fail the build if the vendored addresses.json / network.json
  # drift from citrate-chain's root book (contracts/addresses/<chain id>.json, the live
  # network) and its genesisHash, confirmed by the matching R<n>_GENESIS constant in
  # core/consensus/src/hardening.rs. The reusable JS CI only runs lint/build/test, so
  # vendored-address drift shipped silently. citrate-chain is public, so the job checks it
  # out with the workflow token and always runs (it used to skip itself green without a
  # CITRATE_CHAIN_READ_TOKEN secret, which was never set). scripts/check-address-drift.sh
  # is the local mirror.
  address-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: citrate-sdk-marketplace
      - name: Checkout canonical citrate-chain (sparse, public)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CitrateNetwork/citrate-chain
          ref: main
          path: citrate-chain
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            contracts/addresses/
            core/consensus/src/hardening.rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Address drift gate (blocking)
        run: cd citrate-sdk-marketplace && npm run sync-addresses:check
